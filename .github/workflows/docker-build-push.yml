name: Docker Build and Push

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/expense-management
  PHP_VERSION: "8.5"

jobs:
  test:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/test.Dockerfile
          tags: expense-management:test
          load: true

      - name: Execute tests using sqlite
        run: |
          docker run --rm \
            -e APP_ENV=testing \
            -e APP_DEBUG=true \
            -e APP_KEY=base64:CGBgtDxAmupdM9loOp0fubS8WfeFbMVBmT0VtsyoZrw= \
            -e DB_CONNECTION=sqlite \
            expense-management:test \
            ./vendor/bin/pest --ci --parallel

      - name: Build Docker image for E2E tests
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          tags: expense-management:e2e
          load: true

      - name: Start application container for Playwright tests
        run: |
          docker run -d \
            --name expense-management-app \
            -p 80:80 \
            -e APP_ENV=testing \
            -e APP_DEBUG=true \
            -e APP_KEY=base64:CGBgtDxAmupdM9loOp0fubS8WfeFbMVBmT0VtsyoZrw= \
            -e DB_CONNECTION=sqlite \
            -e APP_URL=http://localhost \
            -e RUN_SEED=true \
            expense-management:e2e

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -s http://localhost > /dev/null; do sleep 2; done'

      - name: Checkout code Expense Management Test
        uses: actions/checkout@v5
        with:
          repository: ajaycalicut17/expense-management-test
          token: ${{ github.actor == 'dependabot[bot]' && github.token || secrets.CODE_QUALITY_ACCESS_TOKEN }}
          path: expense-management-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: expense-management-test
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: expense-management-test
        run: npx playwright install --with-deps

      - name: Create .auth directory
        working-directory: expense-management-test
        run: mkdir -p .auth

      - name: Run Playwright tests
        working-directory: expense-management-test
        env:
          BASE_URL: http://localhost
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop application container
        if: always()
        run: |
          docker stop expense-management-app || true
          docker rm expense-management-app || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"
