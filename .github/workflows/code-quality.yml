  test:
    # needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests using sqlite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: ./vendor/bin/pest --ci --parallel --coverage --only-covered --exactly=89.6

      - name: Checkout code Expense Management Test
        uses: actions/checkout@v5
        with:
          repository: ajaycalicut17/expense-management-test
          token: ${{ github.actor == 'dependabot[bot]' && github.token || secrets.CODE_QUALITY_ACCESS_TOKEN }}
          path: expense-management-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: expense-management-test
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: expense-management-test
        run: npx playwright install --with-deps

      - name: Create .auth directory
        working-directory: expense-management-test
        run: mkdir -p .auth

      - name: Start Laravel application
        working-directory: .
        run: php artisan serve --host=0.0.0.0 --port=3000
        env:
          APP_ENV: testing
          APP_KEY: base64:CGBgtDxAmupdM9loOp0fubS8WfeFbMVBmT0VtsyoZrw=
          DB_CONNECTION: sqlite

      - name: Wait for application to start
        run: sleep 5

      - name: Run Playwright tests
        working-directory: expense-management-test
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
